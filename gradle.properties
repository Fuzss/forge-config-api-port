org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
loom.ignoreDependencyLoomVersionValidation=true

# Mod Attributes
modId=forgeconfigapiport
modName=Forge Config API Port
modVersion=21.1.6
modAuthor=Fuzs
modDescription=Provides NeoForge's & Forge's config systems to other modding ecosystems. Designed for a multi-loader architecture.
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/forge-config-api-port
modIssueUrl=https://github.com/Fuzss/forge-config-api-port/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/forgeconfigapiport.json
modMavenGroup=fuzs.forgeconfigapiport
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=MATCH_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=*

# Version Catalog
dependenciesVersionCatalog=1.21.1-SNAPSHOT
libs.versions.neoforge.version=21.1.214
#dependenciesPuzzlesLibVersion=21.1.0
#dependenciesMinPuzzlesLibVersion=21.1.0

# Mod Publishing
