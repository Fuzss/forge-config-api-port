name: Sync distribution properties

on:
  push:
    branches:
      - 'main'
    paths:
      - 'versions.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-distribution-properties:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync distribution properties
        run: |
          # Fetch all branches
          git fetch --all

          # Ensure main exists locally
          git checkout -B main origin/main

          versions=$(<versions.json)
          script=$(git show main:.github/scripts/sync_distribution_properties.py)

          # Loop over all remote branches
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/); do
            # Remove 'origin/' prefix
            name="${branch#origin/}"

            # Match version branches like 1.21.5 or 26.1.0
            if [[ "$name" =~ ^[0-9]+\.[0-9]+\.([0-9]+|x)$ ]]; then
              echo "Updating branch $name"

              # Switch to version branch, create local branch if needed
              git checkout -B "$name" "origin/$name"

              printf '%s\n' "$script" | python3 - "$versions"

              # Stage and commit changes only if there are any
              git add gradle.properties
              git diff --cached --quiet || {
                git commit -m "Sync distribution properties from versions.json [skip ci]"
                git push origin "$name"
              }
            fi
          done
